# Local file certs. Used by `make dev`, and as the default store when ACME
# cannot reach Let's Encrypt (internal staging/prod hosts).
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/dev.crt
        keyFile: /certs/dev.key
  certificates:
    - certFile: /certs/dev.crt
      keyFile: /certs/dev.key
