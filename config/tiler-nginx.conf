# Reverse proxy in front of TiTiler: shared tile cache + long browser Cache-Control.
# Tile URLs already encode COG path, TMS, colormap, and rescale, so responses are
# immutable for a given URI.

proxy_cache_path /var/cache/nginx/tiles
    levels=1:2
    keys_zone=tiler_tiles:64m
    max_size=2g
    inactive=7d
    use_temp_path=off;

upstream titiler_upstream {
    server titiler:80;
    keepalive 32;
}

server {
    listen 80;
    server_tokens off;

    # Large tile query strings (file:///data/... + style params).
    client_max_body_size 0;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://titiler_upstream;
    }

    # Dynamic COG XYZ tiles — cache rendered bytes; tell browsers to keep them.
    location ~* /cog/tiles/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://titiler_upstream;

        proxy_cache tiler_tiles;
        proxy_cache_key $request_uri;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Set-Cookie Vary;
        # Drop TiTiler's short max-age / CORS so we emit a single set of headers.
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header X-Cache-Status $upstream_cache_status always;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept' always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
