server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /docs {
        return 301 /docs/;
    }

    # Static hub (same pattern as the landing portal at /).
    location = /docs/ {
        try_files /docs/index.html =404;
    }

    location = /docs/orchestrator {
        return 301 /docs/orchestrator/;
    }
    location = /docs/dashboard {
        return 301 /docs/dashboard/;
    }
    location = /docs/generator {
        return 301 /docs/generator/;
    }

    location /docs/ {
        try_files $uri $uri/ =404;
    }

    location / {
        return 404;
    }
}
