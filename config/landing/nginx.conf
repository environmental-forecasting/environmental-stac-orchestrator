server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    # Avoid accidental path catch-all under Traefik Path(`/`) only.
    location / {
        return 404;
    }
}
