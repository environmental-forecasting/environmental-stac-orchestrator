# ------------------------------------------------------------------------------
# Production / Staging overlay: enables TLS, ACME, and HTTPS entrypoints.
# Layered on top of compose.yaml via:
#   docker compose -f compose.yaml -f compose.prod.yaml --env-file .env.<env> up -d
# ------------------------------------------------------------------------------

services:
  traefik:
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Global HTTP -> HTTPS redirect
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # ACME configuration
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    environment:
      - TRAEFIK_CERTIFICATESRESOLVERS_MYRESOLVER_ACME_CASERVER=${ACME_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"

  landing:
    labels:
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.tls.certresolver=myresolver"

  stac-fastapi:
    labels:
      - "traefik.http.routers.stac-fastapi.entrypoints=websecure"
      - "traefik.http.routers.stac-fastapi.tls.certresolver=myresolver"

  file-server:
    labels:
      - "traefik.http.routers.file-server.entrypoints=websecure"
      - "traefik.http.routers.file-server.tls.certresolver=myresolver"

  stac-browser:
    labels:
      - "traefik.http.routers.stac-browser.entrypoints=websecure"
      - "traefik.http.routers.stac-browser.tls.certresolver=myresolver"

  tiler-cache:
    labels:
      - "traefik.http.routers.titiler.entrypoints=websecure"
      - "traefik.http.routers.titiler.tls.certresolver=myresolver"

  dashboard:
    labels:
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=myresolver"
