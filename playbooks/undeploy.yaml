# Tear down a single environmental-stac-orchestrator environment.
#
# Usage:
#   ansible-playbook --ask-become-pass -i inventory.yaml playbooks/undeploy.yaml \
#     -e deploy_env=staging
#
# Optional:
#   dest_dir          (default /opt/environmental-stac-orchestrator)
#   remove_repo=true  - delete the synced tree after compose down
#   remove_volumes=true - docker compose down -v (destroys Postgres for that env)
#   purge_docker=true - remove Docker packages (destructive; off by default)

- name: Undeploy environmental-stac-orchestrator
  hosts: all
  become: true
  vars:
    # Extra-vars / inventory override these. Do not self-reference.
    deploy_env: staging
    dest_dir: /opt/environmental-stac-orchestrator
    remove_repo: false
    remove_volumes: false
    purge_docker: false
    ansible_python_interpreter: /usr/bin/python3.12

  pre_tasks:
    - name: Validate deploy_env
      ansible.builtin.assert:
        that:
          - deploy_env in ['dev', 'staging', 'prod']
        fail_msg: "deploy_env must be one of: dev, staging, prod (got {{ deploy_env }})"

    - name: Resolve undeploy facts
      ansible.builtin.set_fact:
        ssh_deploy_user: "{{ ansible_user | default(ansible_user_id) }}"
        compose_project_name: "stac-{{ deploy_env }}"

  tasks:
    - name: Check deploy directory
      ansible.builtin.stat:
        path: "{{ dest_dir }}"
      register: dest_stat

    - name: Stop and disable the stack service
      ansible.builtin.systemd:
        name: "stac-{{ deploy_env }}.service"
        enabled: false
        state: stopped
        daemon_reload: true
      failed_when: false

    - name: Remove the stack systemd unit
      ansible.builtin.file:
        path: "/etc/systemd/system/stac-{{ deploy_env }}.service"
        state: absent

    - name: Reload systemd after removing the unit
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Stop and remove {{ deploy_env }} stack
      ansible.builtin.command:
        cmd: make down {{ deploy_env }}
        chdir: "{{ dest_dir }}"
      environment:
        DOWN_FLAGS: "{{ '-v' if (remove_volumes | bool) else '' }}"
      when: dest_stat.stat.exists

    - name: Unmount IceNet bind mounts under data/
      ansible.builtin.shell: |
        set -euo pipefail
        awk -v p="{{ dest_dir }}/data/" '$2 ~ ("^" p) { print $2 }' /proc/mounts \
          | sort -r | while read -r m; do umount "$m" || true; done
      when: dest_stat.stat.exists
      changed_when: false

    - name: Remove ingest cron for this env
      ansible.builtin.cron:
        name: "envstacgen ingest ({{ deploy_env }})"
        user: "{{ ssh_deploy_user }}"
        state: absent

    - name: Remove checkout directory
      ansible.builtin.file:
        path: "{{ dest_dir }}"
        state: absent
      when: (remove_repo | bool) and dest_stat.stat.exists

    - name: Purge Docker packages
      when: purge_docker | bool
      block:
        - name: Stop Docker service
          ansible.builtin.service:
            name: docker
            state: stopped
          ignore_errors: true

        - name: Remove Docker packages
          ansible.builtin.dnf:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: absent
            autoremove: true

        - name: Remove Docker CE repo file
          ansible.builtin.file:
            path: /etc/yum.repos.d/docker-ce.repo
            state: absent

    - name: Summarise undeploy
      ansible.builtin.debug:
        msg: >-
          Stopped project {{ compose_project_name }}
          (remove_repo={{ remove_repo }}, remove_volumes={{ remove_volumes }},
          purge_docker={{ purge_docker }}).
