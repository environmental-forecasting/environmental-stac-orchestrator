# Install Python 3.12 on Rocky 9. Used by deploy.yaml, or on its own:
#
#   ansible-playbook --ask-become-pass -i inventory.yaml playbooks/python_install.yaml

- name: Install Python 3.12
  hosts: all
  become: true
  gather_facts: false

  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Ensure system Python exists
      ansible.builtin.raw: dnf install -y python3
      changed_when: false

    - name: Install Python 3.12 and pip
      ansible.builtin.dnf:
        name:
          - python3.12
          - python3.12-pip
          - python3.12-devel
          - python3.12-setuptools
        state: present
