# Deploy the local orchestrator tree to a Rocky 9 (or similar) host.
#
# Syncs this checkout (including submodule working trees) over SSH. It does
# not clone GitHub, so uncommitted and unpushed work is what the VM runs.
#
# Usage (from the orchestrator repo):
#   ansible-playbook --ask-become-pass -i inventory.yaml playbooks/deploy.yaml \
#     -e deploy_env=staging
#
# Stack settings come from the matching local env file
# (.env.development / .env.staging / .env.production). Inventory is SSH only.
# Extra-vars override the file when you need a one-off.
#
# deploy_env: dev | staging | prod
#   dev -> compose.yaml + compose.override.yaml (self-signed HTTPS, hot-reload)
#   staging|prod -> compose.yaml + compose.prod.yaml (Traefik ACME HTTPS)
#
# Optional extra-vars:
#   dest_dir, local_src, public_host,
#   database_password, domain_name, acme_email, acme_caserver,
#   install_cron_ingest (default: true for staging|prod, false for dev),
#   relabel_icenet_data (default: true; allow containers to read NFS IceNet data)

- name: Bootstrap host Python 3.12
  ansible.builtin.import_playbook: python_install.yaml

- name: Deploy environmental-stac-orchestrator
  hosts: all
  become: true
  vars:
    # Extra-vars / inventory override these. Do not self-reference
    # ({{ local_src | default(...) }} recurses).
    deploy_env: staging
    dest_dir: /opt/environmental-stac-orchestrator
    local_src: "{{ playbook_dir }}/.."
    ansible_python_interpreter: /usr/bin/python3.12

  pre_tasks:
    - name: Validate deploy_env
      ansible.builtin.assert:
        that:
          - deploy_env in ['dev', 'staging', 'prod']
        fail_msg: "deploy_env must be one of: dev, staging, prod (got {{ deploy_env }})"

    - name: Resolve paths and env file name
      ansible.builtin.set_fact:
        ssh_deploy_user: "{{ ansible_user | default(ansible_user_id) }}"
        env_file_name: "{{ {'dev': '.env.development', 'staging': '.env.staging', 'prod': '.env.production'}[deploy_env] }}"
        compose_project_name: "stac-{{ deploy_env }}"
        postgres_volume_name: "environmental_pgstac_{{ deploy_env }}"
        cron_ingest_enabled: "{{ install_cron_ingest | default(deploy_env != 'dev') }}"

    - name: Resolve local env path
      ansible.builtin.set_fact:
        local_env_path: "{{ local_src }}/{{ env_file_name }}"

    - name: Read the local env file
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      block:
        - name: Check for a local env file
          ansible.builtin.stat:
            path: "{{ local_env_path }}"
          register: local_env_stat

        - name: Parse local env file
          ansible.builtin.command:
            argv:
              - python3
              - "{{ playbook_dir }}/parse_dotenv.py"
              - "{{ local_env_path }}"
          register: local_env_parse
          changed_when: false
          when: local_env_stat.stat.exists

    - name: Load local env values
      ansible.builtin.set_fact:
        local_env: "{{ (local_env_parse.stdout | from_json) if local_env_stat.stat.exists else {} }}"

    - name: Warn when the local env file is missing
      ansible.builtin.debug:
        msg: >-
          No {{ local_env_path }}. Copy .env.template to {{ env_file_name }}
          and set DATABASE_PASSWORD (and DOMAIN_NAME / ACME_EMAIL for
          staging/prod), or pass the same values with -e.
      when: not local_env_stat.stat.exists

    - name: Resolve stack settings from env file, then extra-vars
      ansible.builtin.set_fact:
        stack_password: "{{ database_password | default(local_env.DATABASE_PASSWORD | default(''), true) }}"
        stack_domain: "{{ domain_name | default(local_env.DOMAIN_NAME | default(''), true) }}"
        stack_acme_email: "{{ acme_email | default(local_env.ACME_EMAIL | default(''), true) }}"
        stack_host: "{{ public_host | default(ansible_host if ((local_env.HOST_IP | default('')) in ['', '127.0.0.1', 'localhost', '::1']) else local_env.HOST_IP, true) }}"
        stack_acme_caserver: "{{ acme_caserver | default(local_env.ACME_CASERVER | default(''), true) }}"

    - name: Default ACME CA when unset
      ansible.builtin.set_fact:
        stack_acme_caserver: "{{ 'https://acme-staging-v02.api.letsencrypt.org/directory' if deploy_env == 'staging' else 'https://acme-v02.api.letsencrypt.org/directory' }}"
      when: deploy_env in ['staging', 'prod'] and (stack_acme_caserver | length) == 0

    - name: Require a real database password
      ansible.builtin.assert:
        that:
          - (stack_password | string | length) > 0
          - stack_password != 'your_secure_password_here'
        fail_msg: >-
          Set DATABASE_PASSWORD in {{ env_file_name }} (not the template
          placeholder), or pass -e database_password='...'.

    - name: Require DOMAIN-related values for Traefik envs
      ansible.builtin.assert:
        that:
          - (stack_domain | string | length) > 0
          - stack_domain != 'example.bas.ac.uk'
          - (stack_acme_email | string | length) > 0
          - "'@' in stack_acme_email"
          - stack_acme_email != 'admin@example.bas.ac.uk'
        fail_msg: >-
          Set DOMAIN_NAME (not example.bas.ac.uk) and a real ACME_EMAIL
          (not admin@example.bas.ac.uk) in {{ env_file_name }}, or pass
          -e domain_name=... and -e acme_email=...
      when: deploy_env in ['staging', 'prod']

  tasks:
    - name: Install Open VM Tools
      ansible.builtin.dnf:
        name: open-vm-tools
        state: present

    - name: Install dnf config-manager plugin
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present

    - name: Add Docker CE repository
      ansible.builtin.command:
        cmd: dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Install host dependencies
      ansible.builtin.dnf:
        name:
          - rsync
          - make
          - openssl
        state: present

    - name: Ensure Docker is started and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add SSH deploy user to docker group
      ansible.builtin.user:
        name: "{{ ssh_deploy_user }}"
        groups: docker
        append: true

    - name: Open HTTP and HTTPS in firewalld
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - http
        - https
      failed_when: false

    - name: Ensure deploy directory exists
      ansible.builtin.file:
        path: "{{ dest_dir }}"
        state: directory
        owner: "{{ ssh_deploy_user }}"
        group: "{{ ssh_deploy_user }}"
        mode: "0755"

    - name: Sync local checkout to the host
      ansible.posix.synchronize:
        src: "{{ local_src }}/"
        dest: "{{ dest_dir }}/"
        archive: true
        delete: true
        rsync_opts:
          # Never descend into bulky trees. Extra patterns in rsync-excludes
          # (Ansible splits rsync_opts on spaces, so no gitignore filter here).
          - "--exclude=.git"
          - "--exclude=/data"
          - "--exclude=tmp"
          - "--exclude=.venv"
          - "--exclude=certs"
          - "--exclude=letsencrypt"
          - "--exclude-from={{ playbook_dir }}/rsync-excludes"
      become: false

    - name: Install env file from the local checkout
      ansible.builtin.copy:
        src: "{{ local_env_path }}"
        dest: "{{ dest_dir }}/{{ env_file_name }}"
        owner: "{{ ssh_deploy_user }}"
        group: "{{ ssh_deploy_user }}"
        mode: "0600"
      when: local_env_stat.stat.exists

    - name: Seed env file from template if missing
      ansible.builtin.copy:
        src: "{{ dest_dir }}/.env.template"
        dest: "{{ dest_dir }}/{{ env_file_name }}"
        remote_src: true
        force: false
        owner: "{{ ssh_deploy_user }}"
        group: "{{ ssh_deploy_user }}"
        mode: "0600"
      when: not local_env_stat.stat.exists

    - name: Common env overrides
      ansible.builtin.set_fact:
        env_overrides:
          POSTGRES_VOLUME_NAME: "{{ postgres_volume_name }}"
          DATABASE_PASSWORD: "{{ stack_password }}"
          HOST_IP: "{{ stack_host }}"
          DASHBOARD_DEBUG: "{{ 'true' if deploy_env == 'dev' else 'false' }}"

    - name: Dev browser URL overrides
      ansible.builtin.set_fact:
        env_overrides: "{{ env_overrides | combine({
          'DOMAIN_NAME': stack_host,
          'FILE_SERVER_URL': 'https://' ~ stack_host ~ '/files',
          'TILER_URL': 'https://' ~ stack_host ~ '/tiles',
        }) }}"
      when: deploy_env == 'dev'

    - name: Staging/prod browser URL and Traefik overrides
      ansible.builtin.set_fact:
        env_overrides: "{{ env_overrides | combine({
          'DOMAIN_NAME': stack_domain,
          'ACME_EMAIL': stack_acme_email,
          'FILE_SERVER_URL': 'https://' ~ stack_domain ~ '/files',
          'TILER_URL': 'https://' ~ stack_domain ~ '/tiles',
        }) }}"
      when: deploy_env in ['staging', 'prod']

    - name: ACME CA for staging and production
      ansible.builtin.set_fact:
        env_overrides: "{{ env_overrides | combine({
          'ACME_CASERVER': stack_acme_caserver,
        }) }}"
      when: deploy_env in ['staging', 'prod']

    - name: Apply env file overrides
      ansible.builtin.lineinfile:
        path: "{{ dest_dir }}/{{ env_file_name }}"
        regexp: "^#?\\s*{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop: "{{ env_overrides | dict2items }}"
      no_log: true

    - name: Generate Docker Compose data mounts
      ansible.builtin.copy:
        dest: "{{ dest_dir }}/compose.data-mounts.yaml"
        content: |
          volumes:
            icenet_data:
              driver: local
              driver_opts:
                type: nfs
                o: "addr=${ICENET_NFS_ADDR:-bsfiles3},ro,nolock,hard,tcp"
                device: ":${ICENET_NFS_PATH:-/san/twinslv/data/pub/sic/icenet/stac-catalog/data}"

          services:
            stac-fastapi:
              volumes:
                - icenet_data:/data:ro
            file-server:
              volumes:
                - icenet_data:/usr/share/nginx/html/data:ro
            titiler:
              volumes:
                - icenet_data:/data:ro

    - name: Drop old data mounts/symlinks overrides
      ansible.builtin.file:
        path: "{{ dest_dir }}/{{ item }}"
        state: absent
      loop:
        - compose.data-symlinks.yaml
      when: item != ""

    - name: Ensure setuptools can build the generator
      ansible.builtin.command:
        cmd: /usr/bin/pip3.12 install -U "setuptools>=61"
      register: setuptools_upgrade
      changed_when: "'Successfully installed' in setuptools_upgrade.stdout"

    - name: Install environmental-stac-generator from the synced tree
      ansible.builtin.command:
        cmd: /usr/bin/pip3.12 install -e "{{ dest_dir }}/environmental-stac-generator"
      register: generator_install
      changed_when: "'Successfully installed' in generator_install.stdout or 'Obtaining file' in generator_install.stdout"

    - name: Locate envstacgen console script
      ansible.builtin.command:
        cmd: >-
          /usr/bin/python3.12 -c
          "import shutil; p=shutil.which('envstacgen');
          assert p, 'envstacgen not on PATH'; print(p)"
      environment:
        PATH: /usr/local/bin:/usr/bin
      register: envstacgen_which
      changed_when: false

    - name: Remember envstacgen path
      ansible.builtin.set_fact:
        envstacgen_bin: "{{ envstacgen_which.stdout | trim }}"

    - name: Detect SELinux mode
      ansible.builtin.command:
        cmd: getenforce
      register: selinux_mode
      changed_when: false
      failed_when: false

    - name: Install SELinux restore tools
      ansible.builtin.dnf:
        name: policycoreutils-python-utils
        state: present
      when: (selinux_mode.stdout | default('')) == 'Enforcing'

    - name: Label the deploy tree for SELinux containers
      ansible.builtin.shell: |
        set -euo pipefail
        semanage fcontext -a -t container_file_t "{{ dest_dir }}(/.*)?" \
          || semanage fcontext -m -t container_file_t "{{ dest_dir }}(/.*)?"
        # -xdev skips IceNet bind mounts (read-only NFS; restorecon cannot
        # write labels there).
        find "{{ dest_dir }}" -xdev -print0 | xargs -0 restorecon -v
      register: selinux_label
      changed_when: "'Relabeled' in selinux_label.stdout"
      when: (selinux_mode.stdout | default('')) == 'Enforcing'

    - name: Allow containers to read NFS IceNet data
      ansible.posix.seboolean:
        name: "{{ item }}"
        state: true
        persistent: true
      loop:
        - container_use_nfs
        - virt_use_nfs
      failed_when: false
      when:
        - (selinux_mode.stdout | default('')) == 'Enforcing'
        - relabel_icenet_data | default(true) | bool

    - name: Bring up {{ deploy_env }} stack
      ansible.builtin.command:
        cmd: make {{ deploy_env }}
        chdir: "{{ dest_dir }}"
      environment:
        CERT_HOST: "{{ stack_domain if (deploy_env != 'dev' and (stack_domain | length) > 0) else stack_host }}"
        COMPOSE_UP_EXTRA: "--build --pull always"

    - name: Install systemd unit for the stack
      ansible.builtin.copy:
        dest: "/etc/systemd/system/stac-{{ deploy_env }}.service"
        mode: "0644"
        content: |
          [Unit]
          Description=environmental-stac-orchestrator ({{ deploy_env }})
          Requires=docker.service
          After=docker.service network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory={{ dest_dir }}
          ExecStart=/usr/bin/make {{ deploy_env }}
          ExecStop=/usr/bin/make down {{ deploy_env }}
          TimeoutStartSec=0

          [Install]
          WantedBy=multi-user.target

    - name: Enable the stack to start on boot
      ansible.builtin.systemd:
        name: "stac-{{ deploy_env }}.service"
        enabled: true
        daemon_reload: true

    # - name: Install daily STAC ingest cron
    #   ansible.builtin.cron:
    #     name: "envstacgen ingest ({{ deploy_env }})"
    #     minute: "0"
    #     hour: "8"
    #     user: "{{ ssh_deploy_user }}"
    #     job: >-
    #       PATH=/usr/local/bin:/usr/bin
    #       cd {{ dest_dir }} || exit 0;
    #       test -d data/stac || exit 0;
    #       find data/stac/ -name catalog.json -print0 |
    #       xargs -0 -r -n 1 {{ envstacgen_bin }} ingest --env-file {{ env_file_name }} -o
    #     state: "{{ 'present' if (cron_ingest_enabled | bool) else 'absent' }}"

    - name: Summarise deployment
      ansible.builtin.debug:
        msg: >-
          Deployed local tree {{ local_src }} as {{ deploy_env }}
          project {{ compose_project_name }} in {{ dest_dir }}
          via make {{ deploy_env }} and {{ env_file_name }}
          (from {{ local_env_path if local_env_stat.stat.exists else 'template' }}).
          Browser tiles: {{ env_overrides.TILER_URL }}.
          IceNet data: Mounted via Docker NFS (defined in .env files).
