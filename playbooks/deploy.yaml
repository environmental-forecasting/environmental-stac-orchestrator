# Deploy environmental-stac-orchestrator on a Rocky 9 (or similar) host.
#
# Usage:
#   ansible-playbook --ask-become-pass -i inventory.yaml playbooks/deploy.yaml \
#     -e deploy_env=staging \
#     -e database_password='...' \
#     -e domain_name=forecast.example.bas.ac.uk \
#     -e acme_email=admin@example.bas.ac.uk
#
# deploy_env: dev | staging | prod
#   dev -> compose.yaml + compose.override.yaml (HTTP via Traefik; override = hot-reload)
#   staging|prod -> compose.yaml + compose.prod.yaml (Traefik HTTPS)
#
# Required extra-vars:
#   database_password  - never leave the template default
#   domain_name, acme_email - required for staging|prod
#
# Optional:
#   dest_dir, repo_url, repo_version, public_host, icenet_data_src,
#   install_cron_ingest (default: true for staging|prod, false fordev),
#   acme_caserver

- name: Deploy environmental-stac-orchestrator
  hosts: all
  become: true
  vars:
    deploy_env: "{{ deploy_env | default('staging') }}"
    dest_dir: "{{ dest_dir | default('/opt/environmental-stac-orchestrator') }}"
    repo_url: "{{ repo_url | default('https://github.com/environmental-forecasting/environmental-stac-orchestrator.git') }}"
    repo_version: "{{ repo_version | default('develop') }}"
    ansible_python_interpreter: /usr/bin/python3.12
    icenet_data_src: "{{ icenet_data_src | default('/data/twins/pub/sic/icenet/stac-catalog/data') }}"

  pre_tasks:
    - name: Validate deploy_env
      ansible.builtin.assert:
        that:
          - deploy_env in ['dev', 'staging', 'prod']
        fail_msg: "deploy_env must be one of: dev, staging, prod (got {{ deploy_env }})"

    - name: Require a real database_password
      ansible.builtin.assert:
        that:
          - database_password is defined
          - (database_password | string | length) > 0
          - database_password != 'your_secure_password_here'
        fail_msg: >-
          Pass -e database_password='...' (do not use the template placeholder).

    - name: Require DOMAIN-related vars for Traefik envs
      ansible.builtin.assert:
        that:
          - domain_name is defined
          - (domain_name | string | length) > 0
          - domain_name != 'example.bas.ac.uk'
          - acme_email is defined
          - (acme_email | string | length) > 0
          - "'@' in acme_email"
        fail_msg: >-
          staging/prod need -e domain_name=... and -e acme_email=...
      when: deploy_env in ['staging', 'prod']

    - name: Resolve deploy target facts
      ansible.builtin.set_fact:
        ssh_deploy_user: "{{ ansible_user | default(ansible_user_id) }}"
        public_host: "{{ public_host | default(domain_name | default(ansible_host)) }}"
        env_file_name: "{{ {'dev': '.env.development', 'staging': '.env.staging', 'prod': '.env.production'}[deploy_env] }}"
        compose_project_name: "stac-{{ deploy_env }}"
        postgres_volume_name: "environmental_pgstac_{{ deploy_env }}"
        cron_ingest_enabled: "{{ install_cron_ingest | default(deploy_env != 'dev') }}"
        base_compose_files: "{{ ['compose.yaml', 'compose.override.yaml'] if deploy_env == 'dev' else ['compose.yaml', 'compose.prod.yaml'] }}"

  tasks:
    - name: Install Open VM Tools
      ansible.builtin.dnf:
        name: open-vm-tools
        state: present

    - name: Add Docker CE repository
      ansible.builtin.command:
        cmd: dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Install host dependencies
      ansible.builtin.dnf:
        name:
          - git
          - make
          - python3.12
          - python3.12-pip
          - python3.12-devel
        state: present

    - name: Ensure Docker is started and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add SSH deploy user to docker group
      ansible.builtin.user:
        name: "{{ ssh_deploy_user }}"
        groups: docker
        append: true

    - name: Ensure deploy directory exists
      ansible.builtin.file:
        path: "{{ dest_dir }}"
        state: directory
        owner: "{{ ssh_deploy_user }}"
        group: "{{ ssh_deploy_user }}"
        mode: "0755"

    - name: Clone or update environmental-stac-orchestrator
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ dest_dir }}"
        version: "{{ repo_version }}"
        recursive: false
        update: true
        force: true
      become_user: "{{ ssh_deploy_user }}"

    - name: Check for .gitmodules
      ansible.builtin.stat:
        path: "{{ dest_dir }}/.gitmodules"
      register: gitmodules_file

    - name: Read .gitmodules
      ansible.builtin.slurp:
        path: "{{ dest_dir }}/.gitmodules"
      register: gitmodules_raw
      when: gitmodules_file.stat.exists

    - name: Rewrite SSH submodule URLs to HTTPS
      ansible.builtin.copy:
        dest: "{{ dest_dir }}/.gitmodules"
        content: "{{ gitmodules_raw.content | b64decode | regex_replace('git@github.com:', 'https://github.com/') }}"
        owner: "{{ ssh_deploy_user }}"
        group: "{{ ssh_deploy_user }}"
      when: gitmodules_file.stat.exists

    - name: Sync and initialize submodules
      ansible.builtin.shell: |
        set -euo pipefail
        git submodule sync
        git submodule update --init --recursive
      args:
        chdir: "{{ dest_dir }}"
      become_user: "{{ ssh_deploy_user }}"
      when: gitmodules_file.stat.exists

    - name: Seed env file from template if missing
      ansible.builtin.copy:
        src: "{{ dest_dir }}/.env.template"
        dest: "{{ dest_dir }}/{{ env_file_name }}"
        remote_src: true
        force: false
        owner: "{{ ssh_deploy_user }}"
        group: "{{ ssh_deploy_user }}"
        mode: "0600"

    - name: Common env overrides
      ansible.builtin.set_fact:
        env_overrides:
          COMPOSE_PROJECT_NAME: "{{ compose_project_name }}"
          POSTGRES_VOLUME_NAME: "{{ postgres_volume_name }}"
          DATABASE_PASSWORD: "{{ database_password }}"
          HOST_IP: "{{ public_host }}"
          DASHBOARD_DEBUG: "{{ 'true' if deploy_env == 'dev' else 'false' }}"

    - name: Dev browser URL overrides
      ansible.builtin.set_fact:
        env_overrides: "{{ env_overrides | combine({
          'DOMAIN_NAME': public_host,
          'FILE_SERVER_URL': 'http://' ~ public_host ~ '/files',
          'TILER_URL': 'http://' ~ public_host ~ '/tiles',
        }) }}"
      when: deploy_env == 'dev'

    - name: Staging/prod browser URL and Traefik overrides
      ansible.builtin.set_fact:
        env_overrides: "{{ env_overrides | combine({
          'DOMAIN_NAME': domain_name,
          'ACME_EMAIL': acme_email,
          'FILE_SERVER_URL': 'https://' ~ domain_name ~ '/files',
          'TILER_URL': 'https://' ~ domain_name ~ '/tiles',
        }) }}"
      when: deploy_env in ['staging', 'prod']

    - name: Staging ACME CA (Let's Encrypt staging, unless overridden)
      ansible.builtin.set_fact:
        env_overrides: "{{ env_overrides | combine({
          'ACME_CASERVER': acme_caserver | default('https://acme-staging-v02.api.letsencrypt.org/directory'),
        }) }}"
      when: deploy_env == 'staging' or (acme_caserver is defined and (acme_caserver | length) > 0)

    - name: Apply env file overrides
      ansible.builtin.lineinfile:
        path: "{{ dest_dir }}/{{ env_file_name }}"
        regexp: "^#?\\s*{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop: "{{ env_overrides | dict2items }}"
      no_log: true

    - name: Check IceNet data source directory
      ansible.builtin.stat:
        path: "{{ icenet_data_src }}"
      register: icenet_data_dir

    - name: Symlink IceNet catalog data into ./data
      when: icenet_data_dir.stat.exists and icenet_data_dir.stat.isdir
      block:
        - name: Ensure data directory exists
          ansible.builtin.file:
            path: "{{ dest_dir }}/data"
            state: directory
            owner: "{{ ssh_deploy_user }}"
            group: "{{ ssh_deploy_user }}"
            mode: "0755"

        - name: List IceNet data entries
          ansible.builtin.find:
            paths: "{{ icenet_data_src }}"
            file_type: any
            recurse: false
          register: icenet_items

        - name: Create data symlinks
          ansible.builtin.file:
            src: "{{ item.path }}"
            dest: "{{ dest_dir }}/data/{{ item.path | basename }}"
            state: link
            owner: "{{ ssh_deploy_user }}"
            group: "{{ ssh_deploy_user }}"
            force: true
          loop: "{{ icenet_items.files }}"

    - name: Generate compose.data-symlinks.yaml for resolved mounts
      ansible.builtin.command:
        cmd: ./generate_data_symlink_override.sh compose.data-symlinks.yaml
        chdir: "{{ dest_dir }}"
      become_user: "{{ ssh_deploy_user }}"
      changed_when: true

    - name: Detect compose.data-symlinks.yaml
      ansible.builtin.stat:
        path: "{{ dest_dir }}/compose.data-symlinks.yaml"
      register: data_symlinks_file

    - name: Assemble final Compose file list
      ansible.builtin.set_fact:
        compose_files: "{{ base_compose_files + (['compose.data-symlinks.yaml'] if data_symlinks_file.stat.exists else []) }}"

    - name: Install environmental-stac-generator from checkout
      ansible.builtin.command:
        cmd: /usr/bin/pip3.12 install -e "{{ dest_dir }}/environmental-stac-generator"
      register: generator_install
      changed_when: "'Successfully installed' in generator_install.stdout or 'Obtaining file' in generator_install.stdout"

    - name: Tear down existing stack for this env (if any)
      community.docker.docker_compose_v2:
        project_src: "{{ dest_dir }}"
        project_name: "{{ compose_project_name }}"
        files: "{{ compose_files }}"
        env_files:
          - "{{ env_file_name }}"
        state: absent
      ignore_errors: true

    - name: Bring up {{ deploy_env }} stack
      community.docker.docker_compose_v2:
        project_src: "{{ dest_dir }}"
        project_name: "{{ compose_project_name }}"
        files: "{{ compose_files }}"
        env_files:
          - "{{ env_file_name }}"
        build: always
        pull: always
        state: present

    - name: Install daily STAC ingest cron
      ansible.builtin.cron:
        name: "envstacgen ingest ({{ deploy_env }})"
        minute: "0"
        hour: "8"
        user: "{{ ssh_deploy_user }}"
        job: >-
          cd {{ dest_dir }} &&
          find data/stac/ -name catalog.json -print0 |
          xargs -0 -n 1 envstacgen ingest --env-file {{ env_file_name }} -o
        state: "{{ 'present' if (cron_ingest_enabled | bool) else 'absent' }}"

    - name: Summarise deployment
      ansible.builtin.debug:
        msg: >-
          Deployed {{ deploy_env }} as project {{ compose_project_name }}
          in {{ dest_dir }} using {{ compose_files | join(', ') }}
          and {{ env_file_name }}.
          Browser tiles: {{ env_overrides.TILER_URL }}.
