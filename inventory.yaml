# Inventory for Ansible deploys of environmental-stac-orchestrator.
#
# SSH only. Stack settings (password, domain, ACME email, HOST_IP) come from
# the matching local .env.development / .env.staging / .env.production.
# See README.

myhosts:
  hosts:
    environmental_stac:
      # DNS name or IP of the Rocky 9 (or similar) guest.
      ansible_host: bsl-icenet-dev-s1
      ansible_user: CHANGE_ME
      # Optional host defaults (override with ansible-playbook -e ...).
      # deploy_env: staging
      # dest_dir: /opt/environmental-stac-orchestrator
      # local_src: /path/to/environmental-stac-orchestrator
      # icenet_data_src: /path/to/source/catalog/data
