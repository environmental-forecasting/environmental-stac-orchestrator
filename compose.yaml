services:
  # Reverse proxy / edge router (serves all path prefixes under localhost or DOMAIN_NAME)
  traefik:
    image: traefik:v3.7.10
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - stac-network

  # Static portal at / (links to dashboard, API, browser, files, tiles, docs)
  landing:
    image: nginx:1.31.3
    restart: unless-stopped
    volumes:
      - ./config/landing/index.html:/usr/share/nginx/html/index.html:ro
      - ./config/landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing.rule=(Host(`${DOMAIN_NAME}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`${HOST_IP}`)) && Path(`/`)"
      - "traefik.http.routers.landing.entrypoints=web"
      - "traefik.http.routers.landing.priority=1"
      - "traefik.http.services.landing.loadbalancer.server.port=80"
    networks:
      - stac-network

  # Zensical docs for orchestrator, dashboard, and generator under /docs
  docs:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.docs
    image: environmental-stac-docs:local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs.rule=(Host(`${DOMAIN_NAME}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`${HOST_IP}`)) && PathPrefix(`/docs`)"
      - "traefik.http.routers.docs.entrypoints=web"
      - "traefik.http.services.docs.loadbalancer.server.port=80"
    networks:
      - stac-network

  # PostgreSQL database with PostGIS (PG 17 + PostGIS 3.5)
  database:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_DBNAME}
    command: postgres -N 1000 -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    networks:
      - stac-network

  # PgSTAC migration and setup of PostGIS db
  pgstac:
    build:
      context: .
      dockerfile: Dockerfile.pgstac-migrate
    image: environmental-stac-pgstac-migrate:0.9.12
    restart: on-failure
    environment:
      - PGHOST=database
      - PGPORT=${DATABASE_PORT:-5432}
      - PGDATABASE=${DATABASE_DBNAME}
      - PGUSER=${DATABASE_USER}
      - PGPASSWORD=${DATABASE_PASSWORD}
    depends_on:
      - database
    command: >
      bash -c "
        echo Waiting for database to be ready.
        pypgstac pgready
        echo Running PgSTAC migration...
        pypgstac migrate && echo PgSTAC migration completed
      "
    networks:
      - stac-network

  # STAC FastAPI with PgSTAC backend
  stac-fastapi:
    # 6.1.3+ required: older images return HTTP 500 on /collections?fields=
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:6.3.1
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=${DATABASE_PORT:-5432}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASS=${DATABASE_PASSWORD}
      - POSTGRES_DBNAME=${DATABASE_DBNAME}
      - POSTGRES_HOST_READER=database
      - POSTGRES_HOST_WRITER=database
      - WEB_CONCURRENCY=10
      - VSI_CACHE=TRUE
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - DB_MIN_CONN_SIZE=1
      - DB_MAX_CONN_SIZE=1
      - USE_API_HYDRATE=FALSE
      - ROOT_PATH=/api
    depends_on:
      - database
      - pgstac
    command: >
      bash -c '
        for i in {1..30}; do
          (echo >/dev/tcp/database/$${POSTGRES_PORT:-5432}) >/dev/null 2>&1 && break
          echo "Waiting for database..."
          sleep 5
        done
        ROOT_PATH_ARG=""
        if [ -n "$${ROOT_PATH:-}" ]; then
          ROOT_PATH_ARG="--root-path $${ROOT_PATH}"
        fi
        exec uvicorn stac_fastapi.pgstac.app:app --host 0.0.0.0 --port 8000 --proxy-headers $${ROOT_PATH_ARG}
      '
    volumes:
      - ./data:/data:ro,rslave
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stac-fastapi.rule=(Host(`${DOMAIN_NAME}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`${HOST_IP}`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.stac-fastapi.entrypoints=web"
      - "traefik.http.middlewares.stac-fastapi-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.stac-fastapi.middlewares=stac-fastapi-strip"
      - "traefik.http.services.stac-fastapi.loadbalancer.server.port=8000"
    networks:
      - stac-network

  # File Server
  file-server:
    image: nginx:1.31.3
    restart: unless-stopped
    volumes:
      - ./data:/usr/share/nginx/html/data:ro,rslave
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.file-server.rule=(Host(`${DOMAIN_NAME}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`${HOST_IP}`)) && PathPrefix(`/files`)"
      - "traefik.http.routers.file-server.entrypoints=web"
      - "traefik.http.middlewares.file-server-strip.stripprefix.prefixes=/files"
      - "traefik.http.routers.file-server.middlewares=file-server-strip"
      - "traefik.http.services.file-server.loadbalancer.server.port=80"
    networks:
      - stac-network

  # STAC Browser - custom image (Dockerfile.stac-browser). Keep pathPrefix,
  # SB_pathPrefix, and Traefik PathPrefix(`/browser`) identical or the SPA blanks.
  stac-browser:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.stac-browser
      args:
        pathPrefix: /browser/
        STAC_BROWSER_VERSION: v5.0.0
    image: environmental-stac-browser:5.0.0-browser
    environment:
      - SB_catalogUrl=/api
      - SB_pathPrefix=/browser/
      - SB_cardViewMode=card
      - SB_cardViewSort=desc
      - SB_crossOriginMedia=anonymous
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stac-browser.rule=(Host(`${DOMAIN_NAME}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`${HOST_IP}`)) && PathPrefix(`/browser`)"
      - "traefik.http.routers.stac-browser.entrypoints=web"
      - "traefik.http.services.stac-browser.loadbalancer.server.port=8080"
    networks:
      - stac-network

  # titiler-pgstac for Item tiles (internal; browsers hit tiler-cache).
  # Pin must match EXPECTED_TITILER_PGSTAC in config/titiler_pgstac_app.py.
  # That wrap patches ItemIdParams and img_profiles; bump both together.
  titiler:
    image: ghcr.io/stac-utils/titiler-pgstac:3.0.0
    restart: unless-stopped
    environment:
      CPL_TMPDIR: /tmp
      GDAL_CACHEMAX: 75%
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: YES
      PYTHONWARNINGS: ignore
      VSI_CACHE: TRUE
      # 512 MiB GDAL VSI block cache per open file handle; helps repeat tile
      # reads from local COGs without re-decoding from disk each time.
      VSI_CACHE_SIZE: 536870912
      # Multi-threaded GDAL block reading and decompression across all container vCPUs
      GDAL_NUM_THREADS: "ALL_CPUS"
      # Increased dataset handle pool to prevent reopening COGs for concurrent tiles
      GDAL_MAX_DATASET_POOL_SIZE: "512"
      WEB_CONCURRENCY: ${TILER_WEB_CONCURRENCY:-4}
      TILEMATRIXSET_DIRECTORY: /custom_tms
      TITILER_PGSTAC_API_ROOT_PATH: /tiles
      PYTHONPATH: /config
      MODULE_NAME: titiler_pgstac_app
      PGHOST: database
      PGPORT: ${DATABASE_PORT:-5432}
      PGUSER: ${DATABASE_USER}
      PGPASSWORD: ${DATABASE_PASSWORD}
      PGDATABASE: ${DATABASE_DBNAME}
      DB_MIN_CONN_SIZE: "1"
      DB_MAX_CONN_SIZE: "1"
    volumes:
      - ./data:/data:ro,rslave
      - ./custom_tms:/custom_tms:ro
      - ./config/titiler_pgstac_app.py:/config/titiler_pgstac_app.py:ro
    depends_on:
      - database
      - pgstac
    networks:
      - stac-network

  # Shared HTTP cache + long Cache-Control in front of TiTiler.
  # Cache sizing/TTL: TILER_CACHE_* in the env file (template -> envsubst).
  # Nginx re-resolves the `titiler` hostname via Docker DNS (see template).
  tiler-cache:
    image: nginx:1.31.3
    restart: unless-stopped
    depends_on:
      - titiler
    environment:
      TILER_CACHE_MAX_SIZE: ${TILER_CACHE_MAX_SIZE:-5g}
      TILER_CACHE_INACTIVE: ${TILER_CACHE_INACTIVE:-1d}
      TILER_CACHE_KEYS_ZONE_SIZE: ${TILER_CACHE_KEYS_ZONE_SIZE:-64m}
      TILER_CACHE_VALID: ${TILER_CACHE_VALID:-1d}
    volumes:
      - ./config/tiler-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - tiler_proxy_cache:/var/cache/nginx/tiles
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.titiler.rule=(Host(`${DOMAIN_NAME}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`${HOST_IP}`)) && PathPrefix(`/tiles`)"
      - "traefik.http.routers.titiler.entrypoints=web"
      - "traefik.http.middlewares.tiler-cache-strip.stripprefix.prefixes=/tiles"
      - "traefik.http.routers.titiler.middlewares=tiler-cache-strip"
      - "traefik.http.services.titiler.loadbalancer.server.port=80"
    networks:
      - stac-network

  # Dashboard
  dashboard:
    restart: unless-stopped
    build:
      context: ./environmental-stac-dashboard
    depends_on:
      - stac-fastapi
      - tiler-cache
    environment:
      - PYTHONPATH=/app/src
      # Browser-facing tile URLs (Traefik /tiles -> tiler-cache).
      - TILER_URL=${TILER_URL}
      # Server-side TiTiler calls run inside the container (Docker DNS).
      - TILER_INTERNAL_URL=http://titiler
      # Server-side STAC client (Docker DNS). Not taken from the env file.
      - STAC_FASTAPI_URL=http://stac-fastapi:8000
      - DASHBOARD_PORT=80
      - DASHBOARD_URL_BASE_PATHNAME=/dashboard/
      - DASHBOARD_DEBUG=${DASHBOARD_DEBUG:-false}
      # Dash callbacks wait on STAC; extra workers serve concurrent users.
      # They share the STAC disk cache.
      - DASHBOARD_WEB_CONCURRENCY=${DASHBOARD_WEB_CONCURRENCY:-4}
      # Seconds a cached Collection or init list stays valid.
      # 0 keeps rows until the store evicts them.
      - STAC_DISK_CACHE_TTL=${STAC_DISK_CACHE_TTL:-86400}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=(Host(`${DOMAIN_NAME}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`${HOST_IP}`)) && PathPrefix(`/dashboard`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.services.dashboard.loadbalancer.server.port=80"
    networks:
      - stac-network

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-environmental_pgstac_dev}
  tiler_proxy_cache:

networks:
  stac-network:
    driver: bridge
