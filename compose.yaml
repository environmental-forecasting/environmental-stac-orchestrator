services:
  # PostgreSQL database with PostGIS
  database:
    image: postgis/postgis:latest
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_DBNAME}
    command: postgres -N 1000 -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - stac-network

  # PgSTAC migration and setup of PostGIS db
  pgstac:
    image: ghcr.io/stac-utils/pgstac:latest
    environment:
      - PGHOST=database
      - PGPORT=${DATABASE_PORT:-5432}
      - PGDATABASE=${DATABASE_DBNAME}
      - PGUSER=${DATABASE_USER}
      - PGPASSWORD=${DATABASE_PASSWORD}
    depends_on:
      - database
    command: >
      bash -c "
        echo Waiting for database to be ready.
        pypgstac pgready
        apt-get update && apt-get -y install python3 python3-pip
        pip3 install psycopg[pool,binary] pypgstac
        echo Running PgSTAC migration...
        pypgstac migrate && echo PgSTAC migration completed
      "
    networks:
      - stac-network

  # STAC FastAPI with PgSTAC backend
  stac-fastapi:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:latest
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=${DATABASE_PORT:-5432}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASS=${DATABASE_PASSWORD}
      - POSTGRES_DBNAME=${DATABASE_DBNAME}
      - POSTGRES_HOST_READER=database
      - POSTGRES_HOST_WRITER=database
      - WEB_CONCURRENCY=10
      - VSI_CACHE=TRUE
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - DB_MIN_CONN_SIZE=1
      - DB_MAX_CONN_SIZE=1
      - USE_API_HYDRATE=FALSE
    depends_on:
      - database
      - pgstac
    command: >
      bash -c "
        apt update && apt-get install -y postgresql-client
        for i in {1..30}; do
          pg_isready -h database -p ${DATABASE_PORT:-5432} && break
          echo 'Waiting for database...'
          sleep 5
        done
        uvicorn stac_fastapi.pgstac.app:app --host 0.0.0.0 --port 8000 --root-path \"$${FASTAPI_ROOT_PATH:-}\"
      "
    volumes:
      - ./data:/data:ro
    networks:
      - stac-network

  # File Server
  file-server:
    image: nginx:alpine
    volumes:
      - ./data:/usr/share/nginx/html/data:ro
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - stac-network

  # STAC Browser
  stac-browser:
    image: ghcr.io/radiantearth/stac-browser:latest
    environment:
      SB_catalogUrl: ${STAC_FASTAPI_URL}
      SB_pathPrefix: /browser
      SB_cardViewMode: card
      SB_cardViewSort: desc
      SB_crossOriginMedia: anonymous
    networks:
      - stac-network

  # TiTiler for dynamic tiling (internal; browsers hit tiler-cache).
  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    environment:
      CPL_TMPDIR: /tmp
      GDAL_CACHEMAX: 75%
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: YES
      GDAL_HTTP_MULTIPLEX: YES
      GDAL_HTTP_VERSION: 2
      PYTHONWARNINGS: ignore
      VSI_CACHE: TRUE
      # 64 MiB GDAL VSI block cache (was 5 MiB); helps repeat tile reads.
      VSI_CACHE_SIZE: 67108864
      # Bitnami/gunicorn worker count (tile renders are CPU-bound).
      WEB_CONCURRENCY: ${TILER_WEB_CONCURRENCY:-4}
      TILEMATRIXSET_DIRECTORY: /custom_tms
      ROOT_PATH: /tiles
    volumes:
      - ./data:/data:ro
      - ./custom_tms:/custom_tms:ro
    networks:
      - stac-network

  # Shared HTTP cache + long Cache-Control in front of TiTiler.
  tiler-cache:
    image: nginx:alpine
    depends_on:
      - titiler
    volumes:
      - ./config/tiler-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - tiler_proxy_cache:/var/cache/nginx/tiles
    networks:
      - stac-network

  # Dashboard
  dashboard:
    build:
      context: ./environmental-stac-dashboard
    depends_on:
      - stac-fastapi
      - tiler-cache
    environment:
      - PYTHONPATH=/app/src
      # Browser-facing tile URLs (user's machine). Keep public host/port or domain.
      - TILER_URL=${TILER_URL}
      # Server-side TiTiler / file-server calls run inside the container — Docker DNS.
      - TILER_INTERNAL_URL=http://titiler
      # Same-origin ``/tiles`` proxy target (tiler-cache, not bare titiler).
      - TILER_PROXY_URL=http://tiler-cache
      - FILE_SERVER_URL=${FILE_SERVER_URL}
      - FILE_SERVER_INTERNAL_URL=http://file-server
      # Server-side STAC client — Docker DNS, not 127.0.0.1.
      - STAC_FASTAPI_URL=http://stac-fastapi:8000
      - DASHBOARD_PORT=80
      - DASHBOARD_DEBUG=${DASHBOARD_DEBUG:-false}
    networks:
      - stac-network

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-environmental_pgstac_dev}
  tiler_proxy_cache:

networks:
  stac-network:
    driver: bridge
